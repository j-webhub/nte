<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>공격 모션 미리보기 · NIGHTFALL</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101819;color:#e9f2e5}*{box-sizing:border-box}body{margin:0}main{max-width:1450px;margin:auto;padding:26px 28px 48px}.eyebrow{letter-spacing:.17em;color:#b5d991;font-size:11px;font-weight:700}h1{font-size:30px;margin:8px 0 10px}p{color:#9bada5;line-height:1.6;margin:0}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:18px 0}.toolbar span{color:#b9c9b8;font-size:13px;margin-right:8px}button{font:inherit;color:#d9e6d5;background:#1b2726;border:1px solid #42544a;border-radius:8px;padding:10px 16px;cursor:pointer}button[aria-pressed=true]{background:#bfe990;color:#172317;border-color:#bfe990;font-weight:700}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.card{min-width:0;background:#192222;border:1px solid #30413b;border-radius:14px;overflow:hidden}.stage{position:relative;display:grid;place-items:center;height:165px;background:radial-gradient(circle,#28403a 0,#1b2827 45%,#182120 75%)}.stage::after{content:'';position:absolute;bottom:18px;width:70px;height:12px;border-radius:100%;background:#0004;z-index:0}canvas{width:150px;height:150px;image-rendering:pixelated;position:relative;z-index:1}.caption{padding:10px 18px 12px}.caption strong{font-size:17px}.caption small{display:block;margin-top:5px;color:#8d9d94;font-size:11px}.foot{margin-top:20px;font-size:12px}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:580px){main{padding:24px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stage{height:160px}canvas{width:150px;height:150px}.caption{padding:12px}.caption strong{font-size:15px}}
</style>
</head>
<body><main><div class="eyebrow">NIGHTFALL / MOTION PREVIEW</div><h1>캐릭터 공격 모션</h1><p>게임에 적용된 정면 공격 동작을 모아 보여드립니다. 쉽게 살펴볼 수 있도록 느리게 재생합니다.</p><div class="toolbar" role="group" aria-label="재생 속도"><span>재생 속도</span><button type="button" data-speed="slow" aria-pressed="true">느리게</button><button type="button" data-speed="normal" aria-pressed="false">게임 속도</button><button type="button" data-action="pause" aria-pressed="false">일시정지</button></div><div class="grid" id="grid"></div><p class="foot">정면에서 멈춰 공격할 때의 모습입니다. 실제 게임은 상황과 공격 속도에 따라 재생 간격이 달라집니다.</p></main>
<script type="module">
import {SPRITE_FRAMES} from './sprite-frames.js?v=1.7.41';
const characters=[['mint','민트'],['zero','이능력자 제로'],['hotori','호토리'],['nanari','나나리'],['shinku','신쿠'],['lacrimosa','라크리모사'],['iloy','일로이'],['zanhong','잔홍'],['akane','아카네'],['raven','레이븐']];
const grid=document.querySelector('#grid'),cards=characters.map(([id,name])=>{const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="stage"><canvas width="180" height="180" role="img" aria-label="${name} 공격 모션"></canvas></div><div class="caption"><strong>${name}</strong><small>정면 공격</small></div>`;grid.append(card);const image=new Image();image.src=`/sprites/${id}-actions.png`;return {id,image,ctx:card.querySelector('canvas').getContext('2d')};});
let speed='slow',paused=false,clock=0,last=0;
document.querySelectorAll('[data-speed]').forEach(button=>button.addEventListener('click',()=>{speed=button.dataset.speed;document.querySelectorAll('[data-speed]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));}));
document.querySelector('[data-action="pause"]').addEventListener('click',e=>{paused=!paused;e.currentTarget.textContent=paused?'재생':'일시정지';e.currentTarget.setAttribute('aria-pressed',String(paused));});
function render(time){if(last&&!paused)clock+=Math.min((time-last)/1000,.05);last=time;const interval=speed==='slow'?.22:.08,elapsed=clock%(interval*3+.4),attack=elapsed<interval*3,frame=attack?Math.min(2,Math.floor(elapsed/interval)):0,row=attack?2:0;for(const {id,image,ctx} of cards){ctx.clearRect(0,0,180,180);if(!image.complete||!image.naturalWidth)continue;const sheet=SPRITE_FRAMES[`${id}-actions`],[sx,sy,w,h]=sheet.frames[row][frame],scale=160/sheet.extent,dw=w*scale,dh=h*scale;ctx.imageSmoothingEnabled=false;ctx.drawImage(image,sx,sy,w,h,(180-dw)/2,165-dh,dw,dh);}requestAnimationFrame(render);}requestAnimationFrame(render);
</script></body></html>
